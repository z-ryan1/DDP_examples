services:
  workshop:
    image: nvcr.io/nvidia/pytorch:24.10-py3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace
    working_dir: /workspace/distributed/ddp-tutorial-series
    stdin_open: true
    tty: true
